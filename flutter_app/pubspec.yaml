name: openchess_arena
description: OpenChess Arena - Modern chess platform alternative to Chess.com
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.15.0
  firebase_storage: ^11.6.0
  firebase_messaging: ^14.7.10

  # State Management
  provider: ^6.1.1

  # Networking
  http: ^1.1.2
  socket_io_client: ^2.0.3+1
  web_socket_channel: ^2.4.0

  # Chess Logic
  chess: ^0.8.1

  # UI
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  lottie: ^2.7.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.0
  page_transition: ^2.1.0
  flutter_animate: ^4.3.0
  simple_animations: ^5.0.2

  # Audio
  audioplayers: ^5.2.1

  # Utils
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^17.0.0
  connectivity_plus: ^5.0.2
  vibration: ^1.8.4
  intl: ^0.19.0
  uuid: ^4.2.1
  path_provider: ^2.1.1
  package_info_plus: ^5.0.1
  url_launcher: ^6.2.1
  image_picker: ^1.0.4
  flutter_colorpicker: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/
    - assets/fonts/

  fonts:
    - family: ChessSans
      fonts:
        - asset: assets/fonts/ChessSans.ttf
